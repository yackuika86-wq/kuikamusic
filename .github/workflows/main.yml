
name: Build KuikaMusic APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Encontrar proyecto
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew \
            -not -path './.git/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f \
              -iname '*.zip' -print -quit)
            if [ -z "$ZIP_FILE" ]; then
              echo "No se encontró el ZIP"
              exit 1
            fi
            mkdir -p build-source
            unzip -q "$ZIP_FILE" -d build-source
            WRAPPER=$(find build-source -type f \
              -name gradlew -print -quit)
          fi

          if [ -z "$WRAPPER" ]; then
            echo "No se encontró gradlew"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: KuikaMusic-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
